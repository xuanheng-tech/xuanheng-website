<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 810" role="img">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .num { font-family: "Iowan Old Style", Georgia, serif; }
    </style>
  </defs>
  <rect width="460" height="810" fill="#F6F1E8"/>

  <!-- legend -->
  <g class="t" font-size="13" font-weight="600">
    <rect x="40" y="36" width="10" height="10" fill="none" stroke="#171717" stroke-width="1.5"/>
    <text x="58" y="46" fill="#171717">上下文管线</text>
    <rect x="138" y="36" width="10" height="10" fill="none" stroke="#B43A32" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="156" y="46" fill="#B43A32">边界</text>
    <text x="420" y="46" text-anchor="end" fill="#68645E" font-weight="400">2026-09</text>
  </g>
  <line x1="40" y1="60" x2="420" y2="60" stroke="#171717" stroke-width="1" opacity="0.25"/>

  <!-- stages -->
  <g class="t">
    <text class="num" x="40" y="94" font-size="18" fill="#B43A32">01</text>
    <text x="72" y="94" font-size="19" fill="#171717">定位 Git 根</text>
    <text x="72" y="113" font-size="12" fill="#68645E">绝对路径 · 规范化工作树根</text>

    <text class="num" x="40" y="146" font-size="18" fill="#B43A32">02</text>
    <text x="72" y="146" font-size="19" fill="#171717">读取固定根文件</text>
    <text x="72" y="165" font-size="12" fill="#68645E">AGENTS.md · README.md · 入口文件</text>

    <text class="num" x="40" y="198" font-size="18" fill="#B43A32">03</text>
    <text x="72" y="198" font-size="19" fill="#171717">有界选择 AGENTS 章节</text>
    <text x="72" y="217" font-size="12" fill="#68645E">头部 + --focus 命中节，其余仅索引</text>

    <text class="num" x="40" y="250" font-size="18" fill="#B43A32">04</text>
    <text x="72" y="250" font-size="19" fill="#171717">渲染 Markdown 或 JSON</text>
    <text x="72" y="269" font-size="12" fill="#68645E">七个固定分节 · 无时间戳</text>

    <text class="num" x="40" y="302" font-size="18" fill="#B43A32">05</text>
    <text x="72" y="302" font-size="19" fill="#171717">复核状态与哈希</text>
    <text x="72" y="321" font-size="12" fill="#68645E">context_sha256 · statuses · 退出码</text>
  </g>

  <!-- boundary -->
  <g class="t">
    <rect x="40" y="344" width="380" height="100" fill="none" stroke="#B43A32" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="58" y="370" font-size="15" font-weight="600" fill="#B43A32">边界——永不发生</text>
    <text x="58" y="392" font-size="12" fill="#68645E">不抓取 · 不执行仓库代码 · 不访问网络</text>
    <text x="58" y="412" font-size="12" fill="#68645E">不写入目标 · 不做 Git 变更 · 不运行测试</text>
    <text x="58" y="432" font-size="12" fill="#68645E">固定 /usr/bin/git · 环境经过净化</text>
  </g>

  <!-- budget -->
  <text class="t" x="40" y="472" font-size="12" fill="#68645E">输出 ≤ 98,304 B · AGENTS 头部 ≤ 4 KiB · 目录树 ≤ 12 KiB</text>

  <!-- layers -->
  <line x1="40" y1="492" x2="420" y2="492" stroke="#171717" stroke-width="1" opacity="0.25"/>
  <text class="t" x="40" y="520" font-size="15" font-weight="600" fill="#171717">四层结构</text>
  <g class="t" font-size="12" fill="#68645E">
    <text x="40" y="548" fill="#171717" font-weight="600" font-size="14">CLI 与契约层</text>
    <text x="200" y="548">参数 · 退出码 · 契约</text>
    <text x="40" y="576" fill="#171717" font-weight="600" font-size="14">仓库采集层</text>
    <text x="200" y="576">根校验 · 固定根文件</text>
    <text x="40" y="604" fill="#171717" font-weight="600" font-size="14">渲染与选择层</text>
    <text x="200" y="604">Markdown 或 JSON</text>
    <text x="40" y="632" fill="#171717" font-weight="600" font-size="14">机器可读输出层</text>
    <text x="200" y="632">哈希 · 状态</text>
  </g>

  <!-- note -->
  <line x1="40" y1="660" x2="420" y2="660" stroke="#171717" stroke-width="1" opacity="0.25"/>
  <text class="t" x="40" y="690" font-size="13" fill="#68645E">相同输入产生逐字节一致的输出，</text>
  <text class="t" x="40" y="710" font-size="13" fill="#68645E">两次运行与 cmp 可证。</text>
  <text class="t" x="40" y="738" font-size="13" fill="#68645E">固定选择不是自动脱敏：</text>
  <text class="t" x="40" y="758" font-size="13" fill="#68645E">分享前先检查输出。</text>
</svg>
