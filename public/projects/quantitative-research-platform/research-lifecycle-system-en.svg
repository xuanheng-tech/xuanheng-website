<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 988" role="img">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .num { font-family: "Iowan Old Style", Georgia, serif; }
    </style>
  </defs>
  <rect width="760" height="988" fill="#F6F1E8"/>

  <!-- legend -->
  <g class="t" font-size="15" fill="#68645E">
    <rect x="56" y="46" width="10" height="10" fill="none" stroke="#171717" stroke-width="1.5"/>
    <text x="74" y="56">In place</text>
    <rect x="146" y="46" width="10" height="10" fill="none" stroke="#B43A32" stroke-width="1.5" stroke-dasharray="3 2.4"/>
    <text x="164" y="56">Under construction</text>
    <rect x="298" y="46" width="10" height="10" fill="none" stroke="#68645E" stroke-width="1.5" stroke-dasharray="1.5 3"/>
    <text x="316" y="56">Target architecture</text>
    <text x="704" y="56" text-anchor="end" fill="#68645E">2026-09</text>
  </g>
  <line x1="56" y1="72" x2="704" y2="72" stroke="#171717" stroke-width="1" opacity="0.25"/>

  <!-- 01 -->
  <g>
    <rect x="56" y="96" width="3" height="68" fill="#171717"/>
    <text class="num" x="72" y="122" font-size="24" fill="#B43A32">01</text>
    <text class="t" x="112" y="122" font-size="26" fill="#171717">Research question</text>
    <circle cx="116" cy="145" r="3" fill="#68645E"/>
    <text class="t" x="128" y="149" font-size="16" fill="#68645E">Human-led · hypothesis and scope</text>
    <path d="M 74 176 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- 02 -->
  <g>
    <rect x="56" y="196" width="3" height="90" fill="#171717"/>
    <text class="num" x="72" y="222" font-size="24" fill="#B43A32">02</text>
    <text class="t" x="112" y="222" font-size="26" fill="#171717">Data &amp; investable universe</text>
    <rect x="112" y="240" width="8" height="8" fill="none" stroke="#171717" stroke-width="1.2"/>
    <text class="t" x="128" y="249" font-size="16" fill="#68645E">Contracts · ingestion · publication · read-only PIT access</text>
    <rect x="112" y="262" width="8" height="8" fill="none" stroke="#171717" stroke-width="1.2"/>
    <text class="t" x="128" y="271" font-size="16" fill="#68645E">Universe: reviewed point-in-time ETF membership</text>
    <path d="M 74 298 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- 03 -->
  <g>
    <rect x="56" y="318" width="3" height="112" fill="#171717"/>
    <text class="num" x="72" y="344" font-size="24" fill="#B43A32">03</text>
    <text class="t" x="112" y="344" font-size="26" fill="#171717">Factor research &amp; mining</text>
    <rect x="112" y="362" width="8" height="8" fill="none" stroke="#171717" stroke-width="1.2"/>
    <text class="t" x="128" y="371" font-size="16" fill="#68645E">Numeric primitives · operator and formal factor registry</text>
    <rect x="112" y="384" width="8" height="8" fill="none" stroke="#B43A32" stroke-width="1.2" stroke-dasharray="3 2.2"/>
    <text class="t" x="128" y="393" font-size="16" fill="#68645E">Formula representation (phase 1 merged; compilation/execution in progress)</text>
    <rect x="112" y="406" width="8" height="8" fill="none" stroke="#68645E" stroke-width="1.2" stroke-dasharray="1.5 3"/>
