    <path d="M 74 442 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- 04 -->
  <g>
    <rect x="56" y="462" width="3" height="68" fill="#171717"/>
    <text class="num" x="72" y="488" font-size="24" fill="#B43A32">04</text>
    <text class="t" x="112" y="488" font-size="26" fill="#171717">Factor testing &amp; screening</text>
    <rect x="112" y="506" width="8" height="8" fill="none" stroke="#171717" stroke-width="1.2"/>
    <text class="t" x="128" y="515" font-size="16" fill="#68645E">Evaluation · screening · integration</text>
    <path d="M 74 542 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- 05 -->
  <g>
    <rect x="56" y="562" width="3" height="90" fill="#171717"/>
    <text class="num" x="72" y="588" font-size="24" fill="#B43A32">05</text>
    <text class="t" x="112" y="588" font-size="26" fill="#171717">Portfolio construction &amp; backtesting</text>
    <rect x="112" y="606" width="8" height="8" fill="none" stroke="#171717" stroke-width="1.2"/>
    <text class="t" x="128" y="615" font-size="16" fill="#68645E">Target portfolios and rebalancing decisions</text>
    <rect x="112" y="628" width="8" height="8" fill="none" stroke="#171717" stroke-width="1.2"/>
    <text class="t" x="128" y="637" font-size="16" fill="#68645E">Backtest framework · simulation and performance</text>
    <path d="M 74 664 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- 06 -->
  <g>
    <rect x="56" y="684" width="3" height="112" fill="#171717"/>
    <text class="num" x="72" y="710" font-size="24" fill="#B43A32">06</text>
    <text class="t" x="112" y="710" font-size="26" fill="#171717">Paper/live execution &amp; risk control</text>
    <rect x="112" y="728" width="8" height="8" fill="none" stroke="#171717" stroke-width="1.2"/>
    <text class="t" x="128" y="737" font-size="16" fill="#68645E">Execution runtime · orders and reconciliation</text>
    <rect x="112" y="750" width="8" height="8" fill="none" stroke="#B43A32" stroke-width="1.2" stroke-dasharray="3 2.2"/>
    <text class="t" x="128" y="759" font-size="16" fill="#68645E">Live admission, stage by stage</text>
    <rect x="112" y="772" width="8" height="8" fill="none" stroke="#68645E" stroke-width="1.2" stroke-dasharray="1.5 3"/>
    <text class="t" x="128" y="781" font-size="16" fill="#68645E">Risk model and limits</text>
  </g>

  <!-- support band: five domains -->
  <line x1="56" y1="830" x2="704" y2="830" stroke="#171717" stroke-width="1" opacity="0.25"/>
  <text class="t" x="56" y="862" font-size="16" fill="#171717" font-weight="600">Five supporting domains</text>
  <g class="t" font-size="14" fill="#171717">
    <rect x="56" y="878" width="86" height="28" fill="none" stroke="#171717" stroke-width="1" opacity="0.55"/>
    <text x="99" y="897" text-anchor="middle">Data</text>
    <rect x="152" y="878" width="86" height="28" fill="none" stroke="#171717" stroke-width="1" opacity="0.55"/>
    <text x="195" y="897" text-anchor="middle">Research</text>
    <rect x="248" y="878" width="86" height="28" fill="none" stroke="#171717" stroke-width="1" opacity="0.55"/>
    <text x="291" y="897" text-anchor="middle">Trading</text>
    <rect x="344" y="878" width="86" height="28" fill="none" stroke="#171717" stroke-width="1" opacity="0.55"/>
    <text x="387" y="897" text-anchor="middle">Operations</text>
    <rect x="440" y="878" width="86" height="28" fill="none" stroke="#171717" stroke-width="1" opacity="0.55"/>
    <text x="483" y="897" text-anchor="middle">Platform</text>
  </g>
  <text class="t" x="56" y="938" font-size="15" fill="#68645E">Investment operations · orchestration and business console ·</text>
  <text class="t" x="56" y="960" font-size="15" fill="#68645E">project handbook · shared infrastructure</text>
</svg>
