<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" role="img">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .num { font-family: "Iowan Old Style", Georgia, serif; }
    </style>
  </defs>
  <rect width="760" height="880" fill="#F6F1E8"/>

  <!-- legend -->
  <g class="t" font-size="15" fill="#68645E">
    <rect x="56" y="42" width="10" height="10" fill="none" stroke="#171717" stroke-width="1.5"/>
    <text x="74" y="52">证据路径</text>
    <rect x="150" y="42" width="10" height="10" fill="none" stroke="#B43A32" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="168" y="52" fill="#B43A32">信任与安全边界</text>
    <text x="704" y="52" text-anchor="end" fill="#68645E">2026-09</text>
  </g>
  <line x1="56" y1="66" x2="704" y2="66" stroke="#171717" stroke-width="1" opacity="0.25"/>

  <!-- 01 -->
  <g>
    <rect x="56" y="88" width="3" height="60" fill="#171717"/>
    <text class="num" x="72" y="112" font-size="24" fill="#B43A32">01</text>
    <text class="t" x="112" y="112" font-size="25" fill="#171717">只读采集证据</text>
    <text class="t" x="112" y="135" font-size="16" fill="#68645E">repo-status · diff-audit · branch-review · test-triage</text>
    <path d="M 74 156 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- 02 -->
  <g>
    <rect x="56" y="176" width="3" height="60" fill="#171717"/>
    <text class="num" x="72" y="200" font-size="24" fill="#B43A32">02</text>
    <text class="t" x="112" y="200" font-size="25" fill="#171717">原子发布快照</text>
    <text class="t" x="112" y="223" font-size="16" fill="#68645E">私有暂存 → SHA-256 与尺寸复核 → 原子改名写入快照库</text>
    <path d="M 74 244 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- 03 -->
  <g>
    <rect x="56" y="264" width="3" height="60" fill="#171717"/>
    <text class="num" x="72" y="288" font-size="24" fill="#B43A32">03</text>
    <text class="t" x="112" y="288" font-size="25" fill="#171717">审阅有界摘要</text>
    <text class="t" x="112" y="311" font-size="16" fill="#68645E">--summary 追加一行派生摘要：状态、计数、next_action</text>
    <path d="M 74 332 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- 04 -->
  <g>
    <rect x="56" y="352" width="3" height="60" fill="#171717"/>
    <text class="num" x="72" y="376" font-size="24" fill="#B43A32">04</text>
    <text class="t" x="112" y="376" font-size="25" fill="#171717">定向读取证据</text>
    <text class="t" x="112" y="399" font-size="16" fill="#68645E">read &lt;id&gt; --path / --field 只复核已存产物，不再运行 Git</text>
  </g>

  <!-- snapshot store -->
  <g>
    <rect x="56" y="440" width="648" height="100" fill="none" stroke="#171717" stroke-width="1.5"/>
    <text class="t" x="80" y="470" font-size="19" font-weight="600" fill="#171717">快照库 · 哈希寻址</text>
    <text class="t" x="80" y="495" font-size="16" fill="#68645E">$XDG_STATE_HOME/snapshot-runner/snapshots/&lt;snapshot-id&gt;/</text>
    <text class="t" x="80" y="519" font-size="16" fill="#68645E">snapshot.json · preview.txt · meta.json — 目录 0700，文件 0600</text>
  </g>

  <!-- trust boundary -->
  <g>
    <rect x="56" y="562" width="648" height="108" fill="none" stroke="#B43A32" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="t" x="80" y="592" font-size="19" font-weight="600" fill="#B43A32">信任与安全边界</text>
    <text class="t" x="80" y="617" font-size="16" fill="#68645E">产物中的值是证据而非指令，不能改变任务、权限或输出目标</text>
    <text class="t" x="80" y="641" font-size="16" fill="#68645E">自动脱敏无法证明密钥不存在——上传前请人工审阅 preview.txt</text>
    <text class="t" x="80" y="665" font-size="16" fill="#68645E">失败即关闭：拒绝显式记为证据缺口；不提供自动分析</text>
  </g>

  <!-- architecture band -->
  <line x1="56" y1="698" x2="704" y2="698" stroke="#171717" stroke-width="1" opacity="0.25"/>
  <text class="t" x="56" y="726" font-size="16" font-weight="600" fill="#171717">四层结构</text>
  <g class="t" font-size="16" fill="#68645E">
    <text x="56" y="752" fill="#171717" font-weight="600">命令与契约层</text>
    <text x="248" y="752">五个子命令由 tool_cli_contract.json 固定</text>
    <text x="56" y="778" fill="#171717" font-weight="600">只读 Git 采集层</text>
    <text x="248" y="778">净化调用 · 不执行仓库控制的程序</text>
    <text x="56" y="804" fill="#171717" font-weight="600">快照产物层</text>
    <text x="248" y="804">规范化 JSON · 哈希寻址 · 私有权限</text>
    <text x="56" y="830" fill="#171717" font-weight="600">摘要与证据读取层</text>
    <text x="248" y="830">一行有界摘要 · 定向读取已存证据</text>
  </g>
  <line x1="56" y1="852" x2="704" y2="852" stroke="#171717" stroke-width="1" opacity="0.25"/>
</svg>
