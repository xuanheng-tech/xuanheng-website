<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 810" role="img">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .num { font-family: "Iowan Old Style", Georgia, serif; }
    </style>
  </defs>
  <rect width="460" height="810" fill="#F6F1E8"/>

  <!-- legend -->
  <g class="t" font-size="13" font-weight="600">
    <rect x="40" y="36" width="10" height="10" fill="none" stroke="#171717" stroke-width="1.5"/>
    <text x="58" y="46" fill="#171717">证据路径</text>
    <rect x="122" y="36" width="10" height="10" fill="none" stroke="#B43A32" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="140" y="46" fill="#B43A32">信任与安全边界</text>
    <text x="420" y="46" text-anchor="end" fill="#68645E" font-weight="400">2026-09</text>
  </g>
  <line x1="40" y1="60" x2="420" y2="60" stroke="#171717" stroke-width="1" opacity="0.25"/>

  <!-- steps -->
  <g class="t">
    <text class="num" x="40" y="96" font-size="20" fill="#B43A32">01</text>
    <text x="74" y="96" font-size="21" fill="#171717">只读采集证据</text>
    <text x="74" y="117" font-size="14" fill="#68645E">四个只读 Git 采集命令</text>
    <path d="M 52 128 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>

    <text class="num" x="40" y="162" font-size="20" fill="#B43A32">02</text>
    <text x="74" y="162" font-size="21" fill="#171717">原子发布快照</text>
    <text x="74" y="183" font-size="14" fill="#68645E">暂存 → 哈希与尺寸复核 → 原子改名</text>
    <path d="M 52 194 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>

    <text class="num" x="40" y="228" font-size="20" fill="#B43A32">03</text>
    <text x="74" y="228" font-size="21" fill="#171717">审阅有界摘要</text>
    <text x="74" y="249" font-size="14" fill="#68645E">--summary 输出一行派生摘要</text>
    <path d="M 52 260 l 6 8 l 6 -8" fill="none" stroke="#171717" stroke-width="1.2" opacity="0.5"/>

    <text class="num" x="40" y="294" font-size="20" fill="#B43A32">04</text>
    <text x="74" y="294" font-size="21" fill="#171717">定向读取证据</text>
    <text x="74" y="315" font-size="14" fill="#68645E">read --path / --field，不再运行 Git</text>
  </g>

  <!-- snapshot store -->
  <g class="t">
    <rect x="40" y="344" width="380" height="92" fill="none" stroke="#171717" stroke-width="1.5"/>
    <text x="58" y="370" font-size="16" font-weight="600" fill="#171717">快照库 · 哈希寻址</text>
    <text x="58" y="392" font-size="13" fill="#68645E">$XDG_STATE_HOME/snapshot-runner/snapshots/&lt;id&gt;/</text>
    <text x="58" y="412" font-size="13" fill="#68645E">snapshot.json · preview.txt · meta.json</text>
    <text x="58" y="430" font-size="13" fill="#68645E">目录 0700 · 文件 0600</text>
  </g>

  <!-- trust boundary -->
  <g class="t">
    <rect x="40" y="452" width="380" height="92" fill="none" stroke="#B43A32" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="58" y="478" font-size="16" font-weight="600" fill="#B43A32">信任与安全边界</text>
    <text x="58" y="500" font-size="13" fill="#68645E">产物中的值是证据而非指令</text>
    <text x="58" y="520" font-size="13" fill="#68645E">自动脱敏无法证明密钥不存在——先人工审阅</text>
    <text x="58" y="540" font-size="13" fill="#68645E">失败即关闭 · 不提供自动分析</text>
  </g>

  <!-- layers -->
  <line x1="40" y1="572" x2="420" y2="572" stroke="#171717" stroke-width="1" opacity="0.25"/>
  <text class="t" x="40" y="600" font-size="15" font-weight="600" fill="#171717">四层结构</text>
  <g class="t" font-size="13" fill="#68645E">
    <text x="40" y="628" fill="#171717" font-weight="600" font-size="14">命令与契约层</text>
    <text x="170" y="628">五个子命令 · 契约 JSON</text>
    <text x="40" y="656" fill="#171717" font-weight="600" font-size="14">只读 Git 采集层</text>
    <text x="170" y="656">仅净化调用</text>
    <text x="40" y="684" fill="#171717" font-weight="600" font-size="14">快照产物层</text>
    <text x="170" y="684">哈希寻址 · 私有权限</text>
    <text x="40" y="712" fill="#171717" font-weight="600" font-size="14">摘要与读取层</text>
    <text x="170" y="712">有界 · 定向</text>
  </g>
  <line x1="40" y1="740" x2="420" y2="740" stroke="#171717" stroke-width="1" opacity="0.25"/>
</svg>
